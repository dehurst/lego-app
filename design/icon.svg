<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full-bleed square: iOS/Android round the corners themselves. -->
  <rect width="512" height="512" fill="#FFCF00"/>
  <!-- "Drop" motion lines -->
  <g stroke="#E5A800" stroke-width="18" stroke-linecap="round">
    <line x1="196" y1="96" x2="196" y2="150"/>
    <line x1="256" y1="76" x2="256" y2="150"/>
    <line x1="316" y1="96" x2="316" y2="150"/>
  </g>
  <!-- Landing shadow -->
  <ellipse cx="256" cy="420" rx="128" ry="16" fill="#000" opacity="0.14"/>
  <!-- Brick: studs -->
  <rect x="166" y="184" width="68" height="50" rx="10" fill="#C81B16"/>
  <rect x="278" y="184" width="68" height="50" rx="10" fill="#C81B16"/>
  <rect x="166" y="184" width="68" height="16" rx="8" fill="#F04A3E"/>
  <rect x="278" y="184" width="68" height="16" rx="8" fill="#F04A3E"/>
  <!-- Brick: body -->
  <rect x="136" y="224" width="240" height="160" rx="16" fill="#DA2A1F"/>
  <rect x="136" y="224" width="240" height="26" rx="13" fill="#F04A3E"/>
  <rect x="136" y="350" width="240" height="34" rx="16" fill="#B3160F"/>
</svg>
